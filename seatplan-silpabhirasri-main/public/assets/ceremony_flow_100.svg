<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", Tahoma, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-blue-down" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M1,2 L4,7 L7,2 Z" fill="#1d4ed8" />
    </marker>
    <marker id="arr-blue-right" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M2,1 L7,4 L2,7 Z" fill="#1d4ed8" />
    </marker>
    <marker id="arr-blue-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M6,1 L1,4 L6,7 Z" fill="#1d4ed8" />
    </marker>
    <marker id="arr-blue-up" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M1,6 L4,1 L7,6 Z" fill="#1d4ed8" />
    </marker>
    <marker id="arr-red-up" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M1,6 L4,1 L7,6 Z" fill="#dc2626" />
    </marker>
    <marker id="arr-red-right" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M2,1 L7,4 L2,7 Z" fill="#dc2626" />
    </marker>
    <marker id="arr-red-down" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M1,2 L4,7 L7,2 Z" fill="#dc2626" />
    </marker>

    <!-- Bronze Statue Gradients -->
    <linearGradient id="bronze-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b332c" />
      <stop offset="50%" stop-color="#241e1a" />
      <stop offset="100%" stop-color="#181412" />
    </linearGradient>
    <linearGradient id="bronze-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64554b" />
      <stop offset="100%" stop-color="#342b25" />
    </linearGradient>
  </defs>

  <!-- ========================================== -->
  <!-- 1. MAIN COURTYARD WALL (Rounded Gray Box)  -->
  <!-- ========================================== -->
  <rect 
    x="38" 
    y="120" 
    width="732" 
    height="310" 
    rx="36" 
    ry="36" 
    fill="#ffffff" 
    stroke="#475569" 
    stroke-width="2.2" 
  />

  <!-- ========================================== -->
  <!-- 2. GATES / PORTALS (Light Gray Rectangles) -->
  <!-- ========================================== -->
  <!-- Gate 1: Top-Left STAFF -->
  <rect x="94" y="96" width="56" height="50" fill="#cbd5e1" fill-opacity="0.8" rx="2" />
  <text x="122" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">STAFF</text>

  <!-- Gate 2: Top-Middle STAFF -->
  <rect x="388" y="96" width="56" height="50" fill="#cbd5e1" fill-opacity="0.8" rx="2" />
  <text x="416" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">STAFF</text>

  <!-- Gate 3: Right Entrance (ผู้รับรางวัล/ผู้วางกระเช้า) -->
  <rect x="742" y="252" width="54" height="44" fill="#cbd5e1" fill-opacity="0.8" rx="2" />
  <text x="792" y="325" font-size="12" font-weight="bold" fill="#000000">ผู้รับรางวัล/</text>
  <text x="792" y="342" font-size="12" font-weight="bold" fill="#000000">ผู้วาง</text>
  <text x="792" y="359" font-size="12" font-weight="bold" fill="#000000">กระเช้า</text>

  <!-- Gate 4: Bottom-Left (ศิลปินแห่งชาติ) -->
  <rect x="94" y="405" width="56" height="50" fill="#cbd5e1" fill-opacity="0.8" rx="2" />
  <text x="122" y="482" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">ทางเข้า-ออก : ศิลปินแห่งชาติ</text>

  <!-- Gate 5: Bottom-Middle (ประธาน/ ทูต/ นายกสภา/ อธิการ/ ปาฐกถา) -->
  <rect x="388" y="405" width="56" height="50" fill="#cbd5e1" fill-opacity="0.8" rx="2" />
  <text x="416" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">ทางเข้า-ออก : ประธาน/ ทูต/ นายกสภา/</text>
  <text x="416" y="494" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">อธิการ/ ปาฐกถา</text>


  <!-- ========================================== -->
  <!-- 3. WALKING PATHS & ARROWS                  -->
  <!-- ========================================== -->
  
  <!-- STAFF Top-Left Entrance: Blue Arrow Down, curves Right -->
  <line x1="122" y1="92" x2="122" y2="105" stroke="#1d4ed8" stroke-width="2.5" marker-start="url(#arr-blue-down)" />
  <path 
    d="M 122 96 L 122 170 Q 122 192 144 192 L 205 192" 
    fill="none" 
    stroke="#1d4ed8" 
    stroke-width="2.5" 
    stroke-dasharray="5,4" 
    marker-end="url(#arr-blue-right)"
  />

  <!-- Right Entrance: Blue Arrow from Right to Left -->
  <path 
    d="M 830 274 L 712 274" 
    fill="none" 
    stroke="#1d4ed8" 
    stroke-width="2.5" 
    stroke-dasharray="5,4" 
    marker-end="url(#arr-blue-left)"
  />

  <!-- Bottom-Left Gate: Blue Up / Red Down -->
  <line 
    x1="110" y1="465" x2="110" y2="395" 
    stroke="#1d4ed8" 
    stroke-width="2.5" 
    stroke-dasharray="5,4" 
    marker-end="url(#arr-blue-up)" 
  />
  <line 
    x1="134" y1="395" x2="134" y2="465" 
    stroke="#dc2626" 
    stroke-width="2.5" 
    stroke-dasharray="5,4" 
    marker-end="url(#arr-red-down)" 
  />

  <!-- Bottom-Middle Gate: Blue Up / Red Down -->
  <line 
    x1="404" y1="465" x2="404" y2="395" 
    stroke="#1d4ed8" 
    stroke-width="2.5" 
    stroke-dasharray="5,4" 
    marker-end="url(#arr-blue-up)" 
  />
  <line 
    x1="428" y1="395" x2="428" y2="465" 
    stroke="#dc2626" 
    stroke-width="2.5" 
    stroke-dasharray="5,4" 
    marker-end="url(#arr-red-down)" 
  />

  <!-- Awardee Route: Red Dashed Line from circles to top STAFF exit & return right -->
  <path 
    d="M 230 300 L 230 248 Q 230 228 250 228 L 360 228 Q 380 228 380 250 L 380 262 Q 380 282 400 282 L 406 282 Q 426 282 426 262 L 426 90" 
    fill="none" 
    stroke="#dc2626" 
    stroke-width="2.5" 
    stroke-dasharray="5,4" 
    marker-end="url(#arr-red-up)"
  />

  <!-- Return Path Right: from middle to top right -->
  <path 
    d="M 444 110 L 815 110" 
    fill="none" 
    stroke="#dc2626" 
    stroke-width="2.5" 
    stroke-dasharray="5,4" 
    marker-end="url(#arr-red-right)"
  />
  <text x="635" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">
    ผู้รับรางวัล/ผู้วางกระเช้า เดินกลับที่นั่ง
  </text>


  <!-- ========================================== -->
  <!-- 4. ICONS & CEREMONY STATIONS               -->
  <!-- ========================================== -->

  <!-- SILPA BHIRASRI STATUE (Left, facing right) -->
  <g id="statue-silpa-bhirasri" transform="translate(130, 235)">
    <!-- Pedestal Base -->
    <rect x="0" y="88" width="48" height="12" rx="2" fill="#1c1917" stroke="#44403c" stroke-width="1" />
    <rect x="4" y="80" width="40" height="8" rx="1.5" fill="#292524" />
    
    <!-- Body & Coat Silhouette -->
    <!-- Legs / Trousers -->
    <path d="M 12 80 L 14 55 L 20 55 L 22 80 Z" fill="url(#bronze-body)" />
    <path d="M 24 80 L 26 55 L 34 55 L 38 80 Z" fill="url(#bronze-body)" />
    
    <!-- Torso / Suit Jacket -->
    <path d="M 8 55 Q 6 30 14 18 Q 24 16 34 22 L 36 55 Q 24 58 8 55 Z" fill="url(#bronze-body)" />
    <!-- Coat Tails hanging behind -->
    <path d="M 8 38 Q 4 50 6 62 Q 10 58 12 50 Z" fill="#1c1917" />
    
    <!-- Lapel & Shirt collar highlight -->
    <path d="M 22 20 L 27 34 L 20 35 Z" fill="url(#bronze-highlight)" />
    <line x1="25" y1="24" x2="26" y2="38" stroke="#1c1917" stroke-width="1" />

    <!-- Left Arm down -->
    <path d="M 12 22 Q 10 35 12 48 Q 14 50 16 48 Q 16 35 18 24 Z" fill="url(#bronze-body)" />

    <!-- Right Arm (Extended forward, bent at elbow) -->
    <path d="M 28 22 Q 32 30 35 34 L 54 33 Q 57 32 58 35 Q 57 37 53 37 L 33 38 Q 28 35 26 25 Z" fill="url(#bronze-body)" />
    <!-- Sculptor tool in hand -->
    <line x1="55" y1="31" x2="62" y2="38" stroke="#78716c" stroke-width="2" stroke-linecap="round" />

    <!-- Head & Hair (Profile facing right) -->
    <path d="M 20 18 Q 18 8 26 4 Q 34 2 35 10 Q 38 12 36 16 Q 34 19 32 20 Z" fill="url(#bronze-body)" />
    <!-- Nose & chin profile -->
    <path d="M 33 8 L 37 11 L 34 13 L 36 15 L 31 18" fill="none" stroke="url(#bronze-highlight)" stroke-width="1.2" />
    <!-- Hair swept back -->
    <path d="M 22 10 Q 22 4 28 4 Q 34 4 33 9" fill="none" stroke="url(#bronze-highlight)" stroke-width="1.2" />
  </g>

  <!-- MC (พิธีกร) Icon -->
  <g id="icon-mc" transform="translate(230, 160)">
    <!-- Podium/Person in Teal -->
    <circle cx="12" cy="6" r="6" fill="#0d9488" />
    <path d="M 4 22 C 4 15, 20 15, 20 22 Z" fill="#0d9488" />
    <path d="M 16 9 Q 22 9 22 14 L 20 14" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-linecap="round" />
    <rect x="2" y="22" width="20" height="5" rx="1.5" fill="#14b8a6" />
    <text x="12" y="38" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">พิธีกร</text>
  </g>

  <!-- Award Circles (ผู้มอบรางวัล & ผู้เข้ารับรางวัล) -->
  <g id="award-circles" transform="translate(260, 260)">
    <!-- ผู้มอบรางวัล (Green Circle) -->
    <circle cx="16" cy="14" r="14" fill="#a3e635" stroke="#65a30d" stroke-width="1.5" />
    <text x="38" y="19" font-size="12" font-weight="bold" fill="#000000">ผู้มอบรางวัล</text>

    <!-- ผู้เข้ารับรางวัล (Red Circle) -->
    <circle cx="16" cy="54" r="14" fill="#ef4444" stroke="#dc2626" stroke-width="1.5" />
    <text x="38" y="59" font-size="12" font-weight="bold" fill="#000000">ผู้เข้ารับรางวัล</text>
  </g>

  <!-- President (ประธาน) Blue Podium Icon -->
  <g id="icon-president" transform="translate(520, 155)">
    <!-- Lectern / Podium with Papers / Crest -->
    <path d="M 2 8 L 26 8 L 22 26 L 6 26 Z" fill="#0284c7" />
    <rect x="0" y="4" width="28" height="4" rx="1" fill="#0369a1" />
    <rect x="7" y="10" width="14" height="12" rx="1" fill="#ffffff" fill-opacity="0.9" />
    <line x1="10" y1="13" x2="18" y2="13" stroke="#0284c7" stroke-width="1.2" />
    <line x1="10" y1="16" x2="18" y2="16" stroke="#0284c7" stroke-width="1.2" />
    <line x1="10" y1="19" x2="15" y2="19" stroke="#0284c7" stroke-width="1.2" />
    <!-- Microphone on top -->
    <line x1="14" y1="4" x2="14" y2="0" stroke="#334155" stroke-width="1.5" />
    <circle cx="14" cy="0" r="1.5" fill="#334155" />
    <text x="14" y="42" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">ประธาน</text>
  </g>

  <!-- Photographer (ช่างภาพ) Camera Icon -->
  <g id="icon-photographer" transform="translate(650, 205)">
    <!-- Camera Body -->
    <rect x="0" y="6" width="30" height="22" rx="4" fill="none" stroke="#334155" stroke-width="2" />
    <!-- Lens -->
    <circle cx="15" cy="17" r="6" fill="none" stroke="#334155" stroke-width="2" />
    <!-- Flash/Prism Bump -->
    <path d="M 8 6 L 11 2 L 19 2 L 22 6 Z" fill="#334155" />
    <!-- Flash dot -->
    <circle cx="23" cy="10" r="1.5" fill="#334155" />
    <text x="15" y="42" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">ช่างภาพ</text>
  </g>

  <!-- Microphone: อธิการ/ ทูต/ ผอ.สำนักศิลปฯ -->
  <g id="icon-mic" transform="translate(620, 325)">
    <!-- Mic Stand -->
    <rect x="11" y="2" width="6" height="12" rx="3" fill="#334155" />
    <path d="M 8 8 Q 8 16 14 16 Q 20 16 20 8" fill="none" stroke="#334155" stroke-width="1.8" />
    <line x1="14" y1="16" x2="14" y2="24" stroke="#334155" stroke-width="2" />
    <line x1="6" y1="24" x2="22" y2="24" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
    <!-- Audio waves -->
    <path d="M 4 8 Q 2 11 4 14" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 24 8 Q 26 11 24 14" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Label -->
    <text x="14" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">ไมค์: อธิการ/ ทูต/</text>
    <text x="14" y="55" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">ผอ.สำนักศิลปฯ</text>
  </g>


  <!-- ========================================== -->
  <!-- 5. LEGEND (Bottom-Right)                   -->
  <!-- ========================================== -->
  <g id="legend" transform="translate(770, 480)">
    <!-- In: Blue dashed arrow -->
    <line 
      x1="0" y1="0" x2="24" y2="0" 
      stroke="#1d4ed8" 
      stroke-width="2.5" 
      stroke-dasharray="5,4" 
      marker-end="url(#arr-blue-right)" 
    />
    <text x="34" y="4" font-size="12" font-weight="bold" fill="#000000">ทางเข้า</text>

    <!-- Out: Red dashed arrow -->
    <line 
      x1="0" y1="22" x2="24" y2="22" 
      stroke="#dc2626" 
      stroke-width="2.5" 
      stroke-dasharray="5,4" 
      marker-end="url(#arr-red-right)" 
    />
    <text x="34" y="26" font-size="12" font-weight="bold" fill="#000000">ทางออก</text>
  </g>
</svg>
